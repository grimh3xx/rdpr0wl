[package]
name = "rdpr0wl"
version = "0.1.0"
edition = "2021"
authors = ["grimh3xx"]
description = "RDP security probe for authorised pentests: detects NLA/TLS/CredSSP posture; credential validation planned."
license = "MIT"
repository = "https://github.com/grimh3xx/rdpr0wl"
keywords = ["pentest", "rdp", "nla", "credssp", "recon"]

[[bin]]
name = "rdpr0wl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
md4 = "0.10"
md-5 = "0.10"
hmac = "0.12"

[profile.release]
strip = true
lto = true

[dev-dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
